<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Development Course Logger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .setup-notice {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            color: #856404;
        }

        .setup-notice strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .log-entry {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            animation: slideIn 0.5s ease;
        }

        .log-entry h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .log-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .log-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .log-description {
            color: #555;
            line-height: 1.6;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-completed {
            background: #d4edda;
            color: #155724;
        }

        .badge-in-progress {
            background: #fff3cd;
            color: #856404;
        }

        .badge-academic {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-pastoral {
            background: #fce4ec;
            color: #c2185b;
        }

        .badge-other-half {
            background: #fff9c4;
            color: #f57f17;
        }

        .badge-other {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-internal-appointments {
            background: #e1f5fe;
            color: #01579b;
        }

        .badge-internal-appointments-not-selected {
            background: #fce4ec;
            color: #880e4f;
        }

        .badge-external-appointments {
            background: #f1f8e9;
            color: #33691e;
        }

        .badge-committees {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-whole-school-items {
            background: #ede7f6;
            color: #4527a0;
        }

        .badge-training-delivered {
            background: #e0f2f1;
            color: #004d40;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.1em;
        }

        .error-message {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mark Johnson</h1>
            <p>Professional Development Review Portfolio</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 30px; color: #333;">Add New Course Log</h2>
            <form id="courseForm">
                <div class="row">
                    <div class="form-group">
                        <label for="courseName">Course Name *</label>
                        <input type="text" id="courseName" required placeholder="e.g., Advanced Project Management">
                    </div>
                    <div class="form-group">
                        <label for="provider">Provider/Institution *</label>
                        <input type="text" id="provider" required placeholder="e.g., Coursera, LinkedIn Learning">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="academic">Academic</option>
                            <option value="pastoral">Pastoral</option>
                            <option value="other-half">Other Half</option>
                            <option value="other">Other</option>
                            <option value="internal-appointments">Internal Appointments</option>
                            <option value="internal-appointments-not-selected">Internal Appointments - Not Selected</option>
                            <option value="external-appointments">External Appointments</option>
                            <option value="committees">Committees</option>
                            <option value="whole-school-items">Whole-School Items</option>
                            <option value="training-delivered">Training Delivered</option>
                        </select>
                    </div>
                    <div class="form-group"></div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="startDate">Start Date *</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="completionDate">Completion Date</label>
                        <input type="date" id="completionDate">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Course Description & Key Learnings</label>
                    <textarea id="description" placeholder="Describe what you learned and how it applies to your professional development..."></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn">Add Course Log</button>
                <div id="formMessage"></div>
            </form>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">MTJ Portfolio</h2>
            
            <div class="row" style="margin-bottom: 25px;">
                <div class="form-group">
                    <label for="filterCategory">Filter by Category</label>
                    <select id="filterCategory">
                        <option value="all">All Categories</option>
                        <option value="academic">Academic</option>
                        <option value="pastoral">Pastoral</option>
                        <option value="other-half">Other Half</option>
                        <option value="other">Other</option>
                        <option value="internal-appointments">Internal Appointments</option>
                        <option value="internal-appointments-not-selected">Internal Appointments - Not Selected</option>
                        <option value="external-appointments">External Appointments</option>
                        <option value="committees">Committees</option>
                        <option value="whole-school-items">Whole-School Items</option>
                        <option value="training-delivered">Training Delivered</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pdrDate">PDR Date (filters last 2 years)</label>
                    <input type="date" id="pdrDate" placeholder="Select PDR date">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="loadLogs()" class="btn" style="width: auto; padding: 10px 20px;">
                    🔄 Refresh Logs
                </button>
                <button onclick="clearFilters()" style="background: #6c757d; width: auto; padding: 10px 20px;" class="btn">
                    Clear Filters
                </button>
            </div>

            <div id="logsList">
                <div class="loading">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        let logs = [];
        let currentFilter = 'all';
        let pdrDate = null;
        let scriptUrl = 'https://script.google.com/macros/s/AKfycbzzXepc6q-4KoGRHgCWmP1mQ2qSLU1VBGrl9L5dU_OtiaIkygXeu1gVhPUer_WDSyH3Eg/exec';

        // Load logs on page load
        window.addEventListener('load', function() {
            document.getElementById('setupNotice').style.display = 'none';
            document.getElementById('scriptUrl').value = scriptUrl;
            loadLogs();
        });

        function saveConfig() {
            // Not needed anymore - URL is hardcoded
            return;
        }

        async function loadLogs() {
            document.getElementById('logsList').innerHTML = '<div class="loading">Loading logs...</div>';

            try {
                // Add timestamp to prevent caching
                const urlWithTimestamp = scriptUrl + (scriptUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const response = await fetch(urlWithTimestamp);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                // Handle empty sheet
                if (!Array.isArray(data) || data.length === 0) {
                    logs = [];
                    renderLogs();
                    return;
                }

                logs = data.map(row => ({
                    timestamp: row['Timestamp'],
                    courseName: row['Course Name'],
                    provider: row['Provider'],
                    category: row['Category'],
                    startDate: row['Start Date'],
                    completionDate: row['Completion Date'],
                    status: row['Status'],
                    description: row['Description'],
                    files: row['Files']
                })).filter(log => log.courseName); // Filter out empty rows

                renderLogs();
            } catch (error) {
                console.error('Detailed error:', error);
                document.getElementById('logsList').innerHTML = `
                    <div class="error-message">
                        <strong>Error loading logs:</strong> ${error.message}<br><br>
                        <strong>Troubleshooting steps:</strong>
                        <ol style="text-align: left; margin-top: 10px;">
                            <li>Test your URL in a new browser tab - you should see JSON data</li>
                            <li>Make sure "Who has access" is set to "Anyone" in deployment settings</li>
                            <li>Check the browser console (F12) for more details</li>
                            <li>Verify your Google Sheet has the correct column headers</li>
                        </ol>
                    </div>
                `;
            }
        }

        document.getElementById('filterCategory').addEventListener('change', function(e) {
            currentFilter = e.target.value;
            renderLogs();
        });

        document.getElementById('pdrDate').addEventListener('change', function(e) {
            pdrDate = e.target.value ? new Date(e.target.value) : null;
            renderLogs();
        });

        function clearFilters() {
            currentFilter = 'all';
            pdrDate = null;
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('pdrDate').value = '';
            renderLogs();
        }

        document.getElementById('courseForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const logData = {
                courseName: document.getElementById('courseName').value,
                provider: document.getElementById('provider').value,
                category: document.getElementById('category').value,
                startDate: document.getElementById('startDate').value,
                completionDate: document.getElementById('completionDate').value,
                status: 'completed',
                description: document.getElementById('description').value,
                files: ''
            };

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify(logData)
                });

                // Since we can't read the response with no-cors, assume success if no error thrown
                showMessage('formMessage', 'Course log submitted! Refreshing in 2 seconds...', 'success');
                this.reset();
                
                // Reload logs after a short delay
                setTimeout(() => {
                    loadLogs();
                }, 2000);

            } catch (error) {
                showMessage('formMessage', 'Error submitting log. Check console for details. The log may have been saved anyway - try refreshing.', 'error');
                console.error('Submit error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Course Log';
            }
        });

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}-message">${message}</div>`;
            setTimeout(() => {
                element.innerHTML = '';
            }, 5000);
        }

        function getCategoryLabel(category) {
            const labels = {
                'academic': 'Academic',
                'pastoral': 'Pastoral',
                'other-half': 'Other Half',
                'other': 'Other',
                'internal-appointments': 'Internal Appointments',
                'internal-appointments-not-selected': 'Internal Appointments - Not Selected',
                'external-appointments': 'External Appointments',
                'committees': 'Committees',
                'whole-school-items': 'Whole-School Items',
                'training-delivered': 'Training Delivered'
            };
            return labels[category] || category;
        }

        function filterByPDRDate(log) {
            if (!pdrDate) return true;
            
            const logDate = new Date(log.startDate);
            const twoYearsBeforePDR = new Date(pdrDate);
            twoYearsBeforePDR.setFullYear(twoYearsBeforePDR.getFullYear() - 2);
            
            return logDate >= twoYearsBeforePDR && logDate <= pdrDate;
        }

        function renderLogs() {
            const logsList = document.getElementById('logsList');
            let filteredLogs = logs;
            
            // Apply category filter
            if (currentFilter !== 'all') {
                filteredLogs = filteredLogs.filter(log => log.category === currentFilter);
            }
            
            // Apply PDR date filter
            filteredLogs = filteredLogs.filter(filterByPDRDate);
            
            if (filteredLogs.length === 0) {
                let message = 'No course logs yet. Add your first course above!';
                if (logs.length > 0) {
                    message = 'No courses match the selected filters.';
                }
                logsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>${message}</p>
                    </div>
                `;
                return;
            }

            logsList.innerHTML = filteredLogs.map(log => `
                <div class="log-entry">
                    <h3>${log.courseName}</h3>
                    <div class="log-meta">
                        <span class="badge badge-${log.category}">${getCategoryLabel(log.category)}</span>
                        <span>🏢 ${log.provider}</span>
                        <span>📅 ${formatDate(log.startDate)}</span>
                        ${log.completionDate ? `<span>✅ ${formatDate(log.completionDate)}</span>` : ''}
                    </div>
                    ${log.description ? `<div class="log-description">${log.description}</div>` : ''}
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
